name: Build Android APK

# The Capacitor project is generated here rather than committed: capacitor.config.json
# and resources/ are the only Android sources in git, so the Gradle tree can never drift
# from the web build it wraps. Signed with the ANDROID_* secrets when they exist (so
# consecutive APKs install over each other), otherwise a debug APK is produced.
#
# Artifacts: Actions -> Artifacts for every run; tagged builds also get a Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.signing.outputs.version_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web bundle (dist/)
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Generate app icons and splash screen
        run: npm run android:assets

      # Installs the release keystore, stamps versionCode/versionName and declares the
      # camera permission. Falls back to a debug build, with a warning, when the signing
      # secrets are not configured.
      - name: Configure signing, version and permissions
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/prepare-android.mjs

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          set -euo pipefail
          cd android
          case "${{ steps.signing.outputs.mode }}" in
            release) ./gradlew assembleRelease ;;
            *)       ./gradlew assembleDebug ;;
          esac

      # A release APK that silently ends up unsigned would break every future upgrade,
      # so fail loudly here instead of shipping it.
      - name: Verify APK signature
        env:
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="${{ steps.signing.outputs.apk_path }}"
          if [ ! -f "$APK" ]; then
            echo "::error::$APK was not produced (an unsigned build lands in app-release-unsigned.apk — the signing config did not apply)"
            ls -R android/app/build/outputs/apk || true
            exit 1
          fi
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee apk-certs.txt
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            if grep -q "^Signer #1 certificate DN: CN=Android Debug" apk-certs.txt; then
              echo "::error::release APK is signed with a debug key — the signing config was not applied"
              exit 1
            fi
          fi
          if [ -n "$ANDROID_CERT_SHA256" ]; then
            # apksigner prints the digest without separators, so normalise whatever format
            # the secret uses (the docs suggest colons) before comparing.
            EXPECTED="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            grep -qi "$EXPECTED" apk-certs.txt ||
              { echo "::error::APK certificate does not match ANDROID_CERT_SHA256"; exit 1; }
          fi
          echo "camera permission in APK:"
          "$BUILD_TOOLS/aapt2" dump permissions "$APK" | grep -F 'android.permission.CAMERA' ||
            { echo "::error::Missing camera permission"; exit 1; }

      - name: Name APK with its app version
        id: named_apk
        env:
          APK_SOURCE: ${{ steps.signing.outputs.apk_path }}
          APK_VERSION: ${{ steps.signing.outputs.version_name }}
          APK_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          ASSET="optical-transfer-${APK_VERSION}-${APK_MODE}.apk"
          cp "$APK_SOURCE" "$ASSET"
          echo "path=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: optical-transfer-${{ steps.signing.outputs.mode }}-apk
          path: ${{ steps.named_apk.outputs.path }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: optical-transfer-release-apk
          path: release-apk
      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          ASSET="optical-transfer-${VERSION}.apk"
          cp "release-apk/optical-transfer-${VERSION}-release.apk" "$ASSET"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" --title "$GITHUB_REF_NAME" --generate-notes
          fi
