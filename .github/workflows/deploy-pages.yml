name: Deploy PWA to GitHub Pages

# Publishes the built dist/ through actions/deploy-pages. This replaces the
# legacy "Deploy from a branch" pipeline, where dist/ was committed to gh-pages
# by hand (which is how the two branches drifted apart in the past).
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#   gh api -X PUT repos/TatsuhiroC/optical-transfer-pwa/pages -f build_type=workflow
# Until that is done this workflow fails at configure-pages, and the site keeps
# serving gh-pages. After the first green deploy the gh-pages branch can go.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'tests/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never abort a deploy half way

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (tsc && vite build)
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
